function renderLife(){
 if(!['daily','money'].includes(lifeMode))lifeMode='daily';
 const today=day(),daily=state.daily[today]||{},month=today.slice(0,7),money=state.money.filter(x=>x.date.startsWith(month)),income=money.filter(x=>x.kind==='income').reduce((s,x)=>s+x.cents,0),expense=money.filter(x=>x.kind==='expense').reduce((s,x)=>s+x.cents,0);
 let content='';
 if(lifeMode==='daily')content='<div class="card"><div class="row between"><h3>今天的状态</h3><button class="linkbtn" data-action="daily">编辑记录 →</button></div>'+moodsHTML(daily.mood)+'<div class="dailyline"><span>睡眠 '+(daily.sleep?daily.sleep+' 小时':'未记录')+'</span><span>运动 '+(daily.exercise?daily.exercise+' 分钟':'未记录')+'</span></div><p class="notice" style="white-space:pre-wrap;overflow-wrap:anywhere">'+esc(daily.journal||'留一句今天想对自己说的话。')+'</p>'+(daily.rest?'<h3>给自己的休息</h3><p class="notice" style="white-space:pre-wrap;overflow-wrap:anywhere">'+esc(daily.rest)+'</p>':'')+'</div>'+heading('以前的日子')+'<div class="card">'+(Object.keys(state.daily).filter(k=>k!==today).sort().reverse().slice(0,14).map(k=>{const x=state.daily[k];return'<div class="record"><div class="grow"><div class="itemtitle">'+k+' '+(x.mood!=null?MOODS[x.mood][0]:'')+'</div><small style="white-space:pre-wrap;overflow-wrap:anywhere">'+esc(x.journal||'留了一份状态记录')+'</small></div><button class="linkbtn" data-daily-open="'+k+'">查看</button></div>'}).join('')||empty('慢慢记录，日子会在这里留下痕迹。'))+'</div>';
 if(lifeMode==='money')content='<div class="card money-summary"><div class="row between"><h3>'+Number(month.slice(5))+' 月账本</h3><span class="small">人民币 · 元</span></div><div class="twocol" style="margin-top:18px"><div><small>本月支出</small><div class="money" style="font-size:27px;margin-top:5px">¥'+(expense/100).toFixed(2)+'</div></div><div><small>本月收入</small><div class="money income" style="font-size:27px;margin-top:5px">¥'+(income/100).toFixed(2)+'</div></div></div><p class="notice">本月收支差额 ¥'+((income-expense)/100).toFixed(2)+'</p><button class="btn full" data-action="add-money">＋ 记一笔</button></div>'+heading('账目明细','<span class="small">最近 50 笔 · 全部月份</span>')+'<div class="card">'+(state.money.length?state.money.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id)).slice(0,50).map(x=>'<div class="record"><div class="grow"><div class="itemtitle">'+esc(x.category)+'</div><small>'+esc(x.date)+(x.note?' · '+esc(x.note):'')+'</small></div><span class="money '+x.kind+'">'+(x.kind==='income'?'+':'−')+(x.cents/100).toFixed(2)+'</span><button class="delete" data-money-delete="'+x.id+'" aria-label="删除账目">×</button></div>').join(''):empty('从一笔小开销开始，照顾好生活。'))+'</div>';
 $('#lifeView').innerHTML=title('LIFE BETWEEN THE NOTES')+'<div class="tabs" role="group" aria-label="个人空间分类">'+[['daily','状态'],['money','记账']].map(([k,t])=>'<button type="button" data-life-mode="'+k+'" class="'+(k===lifeMode?'active':'')+'" aria-pressed="'+(k===lifeMode)+'">'+t+'</button>').join('')+'</div>'+content;
}
function field(label,id,type='text',value='',extra=''){return'<label for="'+id+'">'+label+'</label><input id="'+id+'" name="'+id+'" type="'+type+'" value="'+esc(value)+'" '+extra+'>'}
function area(label,id,value='',placeholder=''){return'<label for="'+id+'">'+label+'</label><textarea id="'+id+'" name="'+id+'" maxlength="20000" placeholder="'+esc(placeholder)+'">'+esc(value)+'</textarea>'}
function courseSelect(value=''){return'<label for="fCourse">所属科目</label><select id="fCourse"><option value="">综合安排</option>'+COURSE_DEFS.map(c=>'<option value="'+c.id+'" '+(value===c.id?'selected':'')+'>'+c.name+'</option>').join('')+'</select>'}
function formEnd(button='保存'){return'<div class="inlineerror" id="formError" role="alert"></div><div class="sheetfooter"><button type="button" class="btn ghost" data-close>取消</button><button type="submit" class="btn">'+button+'</button></div></form>'}
function showModal(t,html,onSubmit){lastFocus=document.activeElement;$('#modalTitle').textContent=t;$('#modalBody').innerHTML=html;$('#modal').hidden=false;document.body.style.overflow='hidden';$('.sheet').focus();const f=$('#modalBody form');if(f&&onSubmit)f.onsubmit=e=>{e.preventDefault();try{onSubmit(new FormData(f))}catch(err){if($('#formError'))$('#formError').textContent=err.message;else notify(err.message)}}}
function closeModal(){$('#modal').hidden=true;document.body.style.overflow='';if(lastFocus&&document.contains(lastFocus))lastFocus.focus()}
function finish(msg='已保存'){save();closeModal();render();notify(msg)}
function needDate(s){if(!validDay(s))throw Error('请选择有效日期。');return s}
function showTask(taskId){const t=state.tasks.find(x=>x.id===taskId)||{title:'',course:courseId||'',date:view==='home'?homeDate:day(),priority:false};showModal(taskId?'编辑任务':'添加一个具体任务','<form>'+field('今天要推进什么？','fTitle','text',t.title,'required maxlength="200" placeholder="例如：整理古代音乐史第 1 章"')+courseSelect(t.course)+field('计划日期','fDate','date',t.date,'required')+'<label class="row" style="min-height:44px"><input type="checkbox" id="fPriority" '+(t.priority?'checked':'')+' style="width:20px;min-height:20px">设为重点任务</label>'+(taskId?'<button type="button" class="btn danger" data-task-delete="'+taskId+'">删除这项任务</button>':'')+formEnd(),()=>{const v=$('#fTitle').value.trim();if(!v)throw Error('请写下任务内容。');const item={...t,id:t.id||id(),title:v,course:$('#fCourse').value,date:needDate($('#fDate').value),priority:$('#fPriority').checked,done:!!t.done,completedOn:t.completedOn||''};if(taskId)state.tasks[state.tasks.findIndex(x=>x.id===taskId)]=item;else state.tasks.push(item);finish('任务已安排')})}
function showUnit(cId,itemId){const c=state.courses.find(x=>x.id===cId);if(!c)return;const i=c.items.find(x=>x.id===itemId)||{title:'',status:0,notes:'',reviewDate:''};showModal(itemId?'学习单元':'添加学习单元','<form><p class="notice">'+esc(cname(cId))+'</p>'+field('单元名称','fTitle','text',i.title,'required maxlength="200" placeholder="章节名、知识点、题目或分析练习"')+'<label for="fStatus">掌握程度</label><select id="fStatus">'+STATES.map((s,n)=>'<option value="'+n+'" '+(i.status===n?'selected':'')+'>'+s+'</option>').join('')+'</select>'+field('下次复习日期（可留空）','fReview','date',i.reviewDate)+'<div class="chips"><button type="button" data-review-offset="1">明天</button><button type="button" data-review-offset="3">3 天后</button><button type="button" data-review-offset="7">7 天后</button><button type="button" data-review-offset="clear">清除日期</button></div>'+area('笔记 / 卡点 / 资料位置','fNotes',i.notes,'写下答案框架、容易混淆的地方，或参考资料位置。')+(itemId?'<button type="button" class="btn danger" data-unit-delete="'+itemId+'" data-course="'+cId+'">删除这个单元</button>':'')+formEnd(),()=>{const title=$('#fTitle').value.trim();if(!title)throw Error('请填写单元名称。');const rd=$('#fReview').value;if(rd&&!validDay(rd))throw Error('复习日期无效。');const item={id:i.id||id(),title,status:Number($('#fStatus').value),reviewDate:rd,notes:$('#fNotes').value};if(itemId)c.items[c.items.findIndex(x=>x.id===itemId)]=item;else c.items.push(item);finish('学习单元已保存')})}
function showStudy(cId=''){showModal('记录一次学习','<form>'+courseSelect(cId)+field('学习日期','fDate','date',day(),'required')+field('实际学习时长 / 分钟','fMinutes','number','','required min="1" max="1440" step="1" inputmode="numeric" placeholder="例如：45"')+field('这次完成了什么？（选填）','fNote','text','','maxlength="300" placeholder="比时长更重要的是具体收获"')+formEnd(),()=>{const m=Number($('#fMinutes').value);if(!Number.isInteger(m)||m<1||m>1440)throw Error('请输入 1—1440 的整数分钟。');state.study.push({id:id(),date:needDate($('#fDate').value),course:$('#fCourse').value,minutes:m,note:$('#fNote').value.trim()});finish('学习记录已保存')})}
function showDaily(date=day()){const d=state.daily[date]||{};showModal(date===day()?'记录今天的状态':date+' 的状态','<form><p class="notice">'+date+'</p><label for="fMood">此刻的心情</label><select id="fMood"><option value="">暂不选择</option>'+MOODS.map((m,n)=>'<option value="'+n+'" '+(d.mood===n?'selected':'')+'>'+m[0]+' '+m[1]+'</option>').join('')+'</select><div class="twocol"><div>'+field('睡眠 / 小时','fSleep','number',d.sleep||'','min="0" max="24" step="0.1" inputmode="decimal"')+'</div><div>'+field('运动 / 分钟','fExercise','number',d.exercise||'','min="0" max="1440" step="1" inputmode="numeric"')+'</div></div>'+area('今天想说的话','fJournal',d.journal,'情绪、烦恼，或者一件开心的小事。')+area('给自己的休息安排','fRest',d.rest,'散步、听一首喜欢的作品，或早点睡。')+formEnd(),()=>{const sl=Number($('#fSleep').value),ex=Number($('#fExercise').value);if(!Number.isFinite(sl)||sl<0||sl>24||!Number.isInteger(ex)||ex<0||ex>1440)throw Error('请检查睡眠和运动时长。');state.daily[date]={mood:$('#fMood').value===''?null:Number($('#fMood').value),sleep:sl,exercise:ex,journal:$('#fJournal').value,rest:$('#fRest').value};finish('状态已记录')})}
function showReview(wk=monday()){activeWeek=wk;const r=state.reviews[wk]||{};showModal('每周复盘 · '+weekLabel(wk),'<form>'+area('这周的收获','fWins',r.wins,'哪些内容学会了？哪件事让你觉得自己有进步？')+area('卡点与需要调整的地方','fBlocks',r.blocks,'哪个问题反复出现？计划是否太满？')+area('下周优先做的三件事','fNext',r.next,'给下周留三个具体、可完成的方向。')+formEnd(),()=>{state.reviews[wk]={wins:$('#fWins').value,blocks:$('#fBlocks').value,next:$('#fNext').value};finish('复盘已保存')})}
function showMoney(){showModal('记一笔生活账','<form><label for="fKind">收支类型</label><select id="fKind"><option value="expense">支出</option><option value="income">收入</option></select>'+field('金额 / 元','fAmount','text','','required inputmode="decimal" maxlength="12" placeholder="0.00"')+field('日期','fDate','date',day(),'required')+'<label for="fCategory">分类</label><select id="fCategory">'+['餐饮','交通','学习资料','课程费用','日常用品','娱乐休息','收入','其他'].map(x=>'<option>'+x+'</option>').join('')+'</select>'+field('备注（选填）','fNote','text','','maxlength="200"')+formEnd(),()=>{const s=$('#fAmount').value.trim();if(!/^\d{1,9}(\.\d{1,2})?$/.test(s))throw Error('请输入大于 0 的金额，最多两位小数。');const parts=s.split('.'),cents=Number(parts[0])*100+Number(((parts[1]||'')+'00').slice(0,2));if(cents<=0||!Number.isSafeInteger(cents)||cents>99999999999)throw Error('金额超出可记录范围。');state.money.push({id:id(),kind:$('#fKind').value,cents,date:needDate($('#fDate').value),category:$('#fCategory').value,note:$('#fNote').value.trim()});finish('账目已保存')})}
function showReward(){showModal('收藏一个小成就','<form>'+field('值得记住的一点进步','fText','text','','required maxlength="300" placeholder="例如：终于能独立讲清一个知识点"')+field('日期','fDate','date',day(),'required')+formEnd(),()=>{const s=$('#fText').value.trim();if(!s)throw Error('请写下你的小成就。');state.rewards.push({id:id(),date:needDate($('#fDate').value),text:s});finish('这份进步，已经收藏好')})}
function showMusic(){showModal('添加音乐收藏','<form>'+field('作品 / 演绎 / 音乐会','fTitle','text','','required maxlength="200"')+area('版本、感受或链接文字','fNote','','哪一点打动了你？')+formEnd(),()=>{const s=$('#fTitle').value.trim();if(!s)throw Error('请填写收藏名称。');state.music.push({id:id(),date:day(),title:s,note:$('#fNote').value.slice(0,1000)});finish('音乐收藏已保存')})}
function download(content,filename,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
function exportData(){const data={...state,exportedAt:new Date().toISOString()};download(JSON.stringify(data,null,2),'自渡台-备份-'+day()+'.json','application/json');notify('已发起备份下载，请确认文件已保存')}
function showSettings(){showModal('设置与数据备份','<form>'+field('目标日期（可留空）','fExam','date',state.settings.examDate)+'<p class="formhint">填你的个人目标日期；这里不会自动推断考试时间。</p>'+formEnd('保存日期')+'<hr style="border:0;border-top:1px solid var(--line);margin:24px 0"><h3>把积累好好保存</h3><p class="notice">数据只保存在当前设备、当前浏览器的本地存储中，不会自动跨设备同步。清理浏览器数据、更换浏览器或页面地址，可能无法看到原有记录。</p><div class="row" style="flex-wrap:wrap"><button class="btn secondary grow" data-action="export">导出备份</button><button class="btn ghost grow" data-action="import">导入备份</button></div><input type="file" id="importFile" accept=".json,application/json" hidden><p class="notice">建议每周导出一次。换手机或更换使用地址前，先导出，再到新页面导入。隐私或无痕模式不适合长期记录。</p><h3>手机使用</h3><p class="notice">这是手机版网页。若本地文件不能在手机浏览器正常运行，需要通过网页地址打开。本版本尚未发布到互联网，不提供账号或云同步。</p>',()=>{const d=$('#fExam').value;if(d&&!validDay(d))throw Error('目标日期无效。');state.settings.examDate=d;finish('目标日期已保存')})}
function confirmDelete(label,fn){showModal('确认删除','<p class="notice">删除'+esc(label)+'？此操作不能直接撤销，可从之前导出的备份恢复。</p><div class="sheetfooter"><button class="btn ghost" data-close>取消</button><button class="btn danger" id="confirmDelete">确认删除</button></div>');$('#confirmDelete').onclick=()=>{fn();finish('已删除')}}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.hasAttribute('data-close')||b.classList.contains('close')){closeModal();return}
 if(b.dataset.nav){go(b.dataset.nav);return}
 if(b.dataset.homeDate){homeDate=b.dataset.homeDate;homeFilter='all';renderHome();return}
 if(b.dataset.homeFilter){homeFilter=b.dataset.homeFilter;renderHome();return}
 if(b.dataset.monthStep){const date=parseDay(calendarMonth+'-01');date.setMonth(date.getMonth()+Number(b.dataset.monthStep));calendarMonth=day(date).slice(0,7);homeDate=calendarMonth===day().slice(0,7)?day():calendarMonth+'-01';renderHome();return}
 if(b.dataset.planMode){planMode=b.dataset.planMode;renderPlans();return}
 if(b.dataset.lifeMode&&['daily','money'].includes(b.dataset.lifeMode)){lifeMode=b.dataset.lifeMode;renderLife();return}
 if(b.dataset.courseOpen){courseId=b.dataset.courseOpen;renderSubjects();window.scrollTo(0,0);return}
 if(b.dataset.itemOpen){showUnit(b.dataset.course,b.dataset.itemOpen);return}
 if(b.dataset.taskToggle){const t=state.tasks.find(x=>x.id===b.dataset.taskToggle);if(t){t.done=!t.done;t.completedOn=t.done?day():'';save();render();notify(t.done?'又完成了一件事，做得好':'已恢复为待完成')}return}
 if(b.dataset.taskEdit){showTask(b.dataset.taskEdit);return}
 if(b.dataset.mood!==undefined){const date=day();state.daily[date]={...(state.daily[date]||{}),mood:Number(b.dataset.mood)};save();render();notify('今天的心情已记录');return}
 if(b.dataset.reviewOffset){$('#fReview').value=b.dataset.reviewOffset==='clear'?'':offsetDay(day(),Number(b.dataset.reviewOffset));return}
 if(b.dataset.dailyOpen){showDaily(b.dataset.dailyOpen);return}
 if(b.dataset.reviewOpen){showReview(b.dataset.reviewOpen);return}
 const deletes=[['taskDelete','tasks','这项任务'],['moneyDelete','money','这笔账目'],['studyDelete','study','这条学习记录'],['rewardDelete','rewards','这个成就'],['musicDelete','music','这个收藏']];for(const [attr,key,label]of deletes){if(b.dataset[attr]){const target=b.dataset[attr];confirmDelete(label,()=>{state[key]=state[key].filter(x=>x.id!==target)});return}}
 if(b.dataset.unitDelete){const cid=b.dataset.course,iid=b.dataset.unitDelete;confirmDelete('这个学习单元及其笔记',()=>{const c=state.courses.find(x=>x.id===cid);c.items=c.items.filter(x=>x.id!==iid)});return}
 const a=b.dataset.action;
 if(a==='calendar-today'){homeDate=day();calendarMonth=day().slice(0,7);homeFilter='all';renderHome();return}
 if(a==='settings'){showSettings();return}if(a==='add-task'){showTask();return}if(a==='subjects'){go('subjects');return}if(a==='all-tasks'||a==='overdue'){planMode=a==='overdue'?'overdue':'today';go('plans');return}if(a==='daily'){showDaily();return}if(a==='back-subjects'){courseId=null;renderSubjects();return}if(a==='add-unit'){showUnit(courseId);return}
 if(a==='course-notes'){const c=state.courses.find(x=>x.id===courseId);showModal(cname(courseId)+' · 科目笔记','<form>'+area('笔记与下一步','fNotes',c.notes)+formEnd(),()=>{c.notes=$('#fNotes').value;finish()});return}
 if(a==='add-study'){showStudy(b.dataset.course||'');return}if(a==='review'){showReview();return}if(a==='review-history'){const keys=Object.keys(state.reviews).sort().reverse();showModal('往周复盘',keys.length?keys.map(k=>'<div class="item"><div class="grow"><div class="itemtitle">'+weekLabel(k)+'</div><small>'+k.slice(0,4)+' 年</small></div><button class="linkbtn" data-review-open="'+k+'">查看 / 编辑 →</button></div>').join(''):empty('写下第一篇复盘后，会收在这里。'));return}
 if(a==='add-money'){showMoney();return}if(a==='add-reward'){showReward();return}if(a==='add-music'){showMusic();return}if(a==='export'){exportData();return}if(a==='import'){$('#importFile').click();return}
});
$('#settingsBtn').onclick=showSettings;
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))closeModal()});
document.addEventListener('keydown',e=>{if($('#modal').hidden)return;if(e.key==='Escape'){closeModal();return}if(e.key==='Tab'){const focusables=$$('.sheet button,.sheet input,.sheet select,.sheet textarea,.sheet a').filter(x=>!x.disabled&&x.getClientRects().length);if(!focusables.length)return;const first=focusables[0],last=focusables[focusables.length-1];if(e.shiftKey&&(document.activeElement===first||document.activeElement===$('.sheet'))){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
document.addEventListener('change',async e=>{if(e.target.id!=='importFile')return;const file=e.target.files?.[0];if(!file)return;if(file.size>12*1024*1024){notify('备份文件过大，请选择 12MB 以内的 JSON 文件');return}try{const raw=typeof file.text==='function'?await file.text():await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsText(file)});const next=validate(JSON.parse(raw));showModal('确认恢复备份','<p class="notice">备份包含 '+next.tasks.length+' 项任务、'+next.money.length+' 笔账目和 '+next.courses.reduce((s,c)=>s+c.items.length,0)+' 个学习单元。恢复后会替换当前记录。</p><div class="sheetfooter"><button class="btn ghost" data-close>取消</button><button class="btn secondary" id="backupFirst">先备份当前数据</button><button class="btn" id="confirmImport">确认恢复</button></div>');$('#backupFirst').onclick=exportData;$('#confirmImport').onclick=()=>{state=next;courseId=null;finish('备份已恢复')}}catch(err){notify('导入失败：'+(err.message||'文件无法读取'))}});
let lastDay=day();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&day()!==lastDay){lastDay=day();render()}});
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{state=validate(JSON.parse(e.newValue));if($('#modal').hidden)render();else notify('另一页面更新了数据，请关闭编辑后刷新查看')}catch(err){notify('另一页面的数据无法读取，请保留备份')}}});
render();
</script>
